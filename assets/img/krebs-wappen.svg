<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 262" fill="none" role="img" aria-label="KREBS PERFORMANCE Wappen">
  <defs>
    <clipPath id="kw-shield">
      <path d="M14 16 C14 11 18 7 23 7 H197 C202 7 206 11 206 16 V146
               C206 200 166 231 110 254 C54 231 14 200 14 146 Z"/>
